<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to Bulma</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <section class="hero is-medium">
      <div class="hero-body">
        <div class="container-info">
          <p class="title">Ombeatuybar</p>
          <p class="subtitle">Nail Studio</p>
          <p class="info">⭐ 4.9 (250 reseñas)</p>
          <p class="info">📍 Zakia, Querétaro</p>
          <p class="info">🕐 Abierto hoy 10:00 - 20:00</p>
        </div>
      </div>
    </section>
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="navbar-brand">
        <a class="navbar-item">
            <img class="logo"src="./img/ombeautybar.svg" alt="Ombeautybar Nail Studio">
        </a>

        <a
          role="button"
          class="navbar-burger"
          aria-label="menu"
          aria-expanded="false"
          data-target="navbarBasicExample"
        >
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </a>
      </div>

      <div id="navbarBasicExample" class="navbar-menu">
        <div class="navbar-start">
          <a class="navbar-item">Inicio</a>
          <a class="navbar-item">Servicios</a>
          <a class="navbar-item">Galería</a>
          <a class="navbar-item">Nosotros</a>
          <a class="navbar-item">Agendar cita</a>
            </div>
          </div>
        </div>

        <div class="navbar-end">
          <div class="navbar-item">
            <div class="buttons">
              <a class="button is-primary">
                <strong>Iniciar sesión</strong>
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </body>
</html>
